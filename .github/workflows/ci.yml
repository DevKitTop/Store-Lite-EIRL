name: Continuous Integration

on:
  push:
    # Feature branches are validated through their pull request. Running on every
    # branch push duplicated the whole workflow for each PR commit.
    branches: [develop, main]
  pull_request:

env:
  PNPM_VERSION: 10
  NODE_VERSION: 20

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check source encoding
        run: pnpm check:encoding

      - name: Run quality check
        run: pnpm lint && pnpm type-check

      - name: Check migrations ledger (C9 drift guard)
        run: pnpm check:migrations

      - name: Check formatting
        run: pnpm format:check

      - name: Security audit (production dependencies)
        # xlsx (SheetJS CE): EOL, fixes only in Pro - admin Excel imports only
        # postcss: transitive via next, will resolve with next minor update
        run: pnpm audit --prod --ignore GHSA-4r6h-8v6p-xvw6 --ignore GHSA-5pgg-2g8v-p4x9 --ignore GHSA-qx2v-qp2m-jg93

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies (including commitlint)
        run: pnpm install

      - name: Validate current commit (push)
        if: github.event_name == 'push'
        run: git log -1 --format=%B | npx commitlint --verbose

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: [quality]
    # Official Playwright image, pinned to the @playwright/test version in
    # pnpm-lock.yaml. It already ships Chromium and every system library it
    # needs under /ms-playwright, so no apt, no Ubuntu mirrors and no
    # `playwright install --with-deps` are required on this path.
    # Keep this tag in lockstep with @playwright/test: a newer package expects a
    # Chromium revision this image does not ship, and an older package cannot
    # find the revision a newer image replaced. Both must move in one change.
    # --ipc=host keeps Chromium stable: the default container /dev/shm is
    # too small and crashes the browser.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - name: Trust the workspace for git
        # Inside a container the checkout is owned by the runner user while the
        # steps run as root, so git refuses the directory as "dubious ownership"
        # and every test that shells out to git fails. Scoped to the workspace.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Verify toolchain and bundled Chromium
        # Fails fast and explicitly if the image ever stops shipping a browser
        # that this Playwright version can drive.
        run: |
          node --version
          pnpm --version
          npx playwright --version
          node -e "const { chromium } = require('@playwright/test'); chromium.launch().then(async (b) => { console.log('chromium launched:', b.version()); await b.close(); }).catch((e) => { console.error(e); process.exit(1); });"

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
